[package]
name = "cv-tailor-native"
version = "0.1.0"
edition = "2021"
description = "Shared AI runtime and HTTP gateway for CV Tailor"
license = "MIT"
publish = false

[dependencies]
axum = "0.8"
dirs = "6"
futures-util = "0.3"
log = "0.4"
minio = "0.4"
reqwest = { version = "0.12.24", features = ["charset", "json", "stream"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.52.3", features = ["io-util", "macros", "net", "process", "rt", "rt-multi-thread", "time"] }
tower-http = { version = "0.6", features = ["cors", "fs"] }
