[package]
name = "cv-tailor"
version = "0.1.12"
description = "Desktop shell for CV Tailor — local SQLite storage, PDF export, and AI-assisted CV tailoring"
authors = ["Malte Budig <malte.budig@gmx.net>"]
license = "MIT"
repository = "https://github.com/Doderich/cv-tailor"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "cv_tailor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
axum = "0.8"
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
reqwest = { version = "0.12.24", features = ["charset"] }
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tokio = { version = "1.52.3", features = ["io-util", "macros", "net", "process", "rt", "time"] }
tower-http = { version = "0.6", features = ["cors"] }
base64 = "0.22"
pdf-extract = "0.7"
tauri-plugin-process = "2"
tauri-plugin-os = "2"
tauri-plugin-dialog = "2"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
