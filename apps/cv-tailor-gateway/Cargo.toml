[package]
name = "cv-tailor-gateway"
version = "0.1.0"
edition = "2021"
description = "Headless AI gateway for CV Tailor"
license = "MIT"
publish = false

[[bin]]
name = "cv-tailor-gateway"
path = "src/main.rs"

[dependencies]
cv-tailor-native = { path = "../../crates/cv-tailor-native" }
dotenvy = "0.15"
env_logger = "0.11"
log = "0.4"
tokio = { version = "1.52.3", features = ["macros", "rt-multi-thread", "signal"] }
